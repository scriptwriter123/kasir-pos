{% extends "base.html" %}
{% block title %}Daftar — AnjayRetailSoft{% endblock %}
{% block content %}
<div class="card" style="max-width:440px;margin:40px auto">
  <h1>Buat Akun</h1>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form class="stack" method="post" action="/register">
    <label>Email</label>
    <input type="email" name="email" required value="{{ email or '' }}">
    <label>Password (min. 8 karakter)</label>
    <input type="password" name="password" minlength="8" required>
    <label>Nama Toko</label>
    <input type="text" name="store_name" maxlength="150" placeholder="Opsional">
    <p style="margin-top:18px"><button class="btn" type="submit">Daftar</button></p>
  </form>
  <p class="muted" style="font-size:14px">Sudah punya akun? <a href="/login">Masuk</a></p>
</div>
{% endblock %}
